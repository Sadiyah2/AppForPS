    <script>
        (function () {
            // Dynamic Manifest & Inline Service Worker for Online/Offline Caching (HTTP/HTTPS)
            function setupOfflineCapabilities() {
                try {
                    const iconSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="22" fill="#4f46e5"/><path d="M50 22L76 36v28L50 78 24 64V36l26-14z" fill="none" stroke="#fff" stroke-width="6" stroke-linejoin="round"/><path d="M24 36l26 14 26-14M50 50v28" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/></svg>`;
                    const iconUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(iconSvg);

                    const manifest = {
                        name: 'Tracking ID Extractor',
                        short_name: 'Tracking ID',
                        start_url: '.',
                        display: 'standalone',
                        background_color: '#f1f5f9',
                        theme_color: '#4f46e5',
                        icons: [{ src: iconUrl, sizes: '192x192', type: 'image/svg+xml' }]
                    };
                    const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
                    const manifestLink = document.createElement('link');
                    manifestLink.rel = 'manifest';
                    manifestLink.href = URL.createObjectURL(manifestBlob);
                    document.head.appendChild(manifestLink);

                    // Register Service Worker when hosted over http/https so it works offline after first visit
                    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.protocol === 'http:')) {
                        const swCode = `
                            const CACHE_NAME = 'tracking-id-extractor-v1';
                            self.addEventListener('install', (e) => {
                                self.skipWaiting();
                                e.waitUntil(caches.open(CACHE_NAME).then((cache) => cache.addAll([self.location.href])));
                            });
                            self.addEventListener('activate', (e) => e.waitUntil(self.clients.claim()));
                            self.addEventListener('fetch', (e) => {
                                e.respondWith(
                                    caches.match(e.request).then((cached) => {
                                        return cached || fetch(e.request).then((resp) => {
                                            const copy = resp.clone();
                                            caches.open(CACHE_NAME).then((c) => c.put(e.request, copy));
                                            return resp;
                                        }).catch(() => cached);
                                    })
                                );
                            });
                        `;
                        const swBlob = new Blob([swCode], { type: 'application/javascript' });
                        navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(() => {});
                    }
                } catch (e) {
                    // Safe fallback for local file:// mode
                }
            }

            const networkStatusPill = document.getElementById('networkStatusPill');
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');

            function updateNetworkUI() {
                if (navigator.onLine) {
                    statusDot.classList.remove('is-offline');
                    statusText.textContent = 'Online (Offline Ready)';
                } else {
                    statusDot.classList.add('is-offline');
                    statusText.textContent = 'Offline Mode';
                }
            }

            window.addEventListener('online', () => {
                updateNetworkUI();
                showToast('အင်တာနက် ပြန်လည်ချိတ်ဆက်မိပါပြီ (Online)');
            });

            window.addEventListener('offline', () => {
                updateNetworkUI();
                showToast('Offline Mode ဖြင့် ဆက်လက်အသုံးပြုနိုင်ပါသည်');
            });

            const inputText = document.getElementById('inputText');
            const outputText = document.getElementById('outputText');
<!-- ... existing code ... -->
            // Initialize app on load
            setupOfflineCapabilities();
            updateNetworkUI();
            initTodayDate();
        })();
    </script>
